# AuthCore - Russian (Русский) localization
# Only translated fields are included; all other fields fall back to the
# bundled English defaults.

prompt-admin-change-user-mode {
    action-bar {
        text="Режим пользователя %1$s успешно изменён на %2$s!"
    }
}

prompt-admin-list-of-players {
    message {
        text="Список '%1$s' в AuthCore: %2$s"
    }
}

prompt-admin-reloaded-configuration {
    action-bar {
        text="Файлы конфигурации AuthCoreServer успешно перезагружены!"
    }
}

prompt-admin-spawn-location-updated {
    action-bar {
        text="Новая точка появления в Limbo настроена: Мир: %1$s | X: %2$s | Y: %3$s | Z: %4$s"
    }
}

prompt-admin-user-data-deleted {
    logout {
        text="Аккаунт пользователя '%1$s' был удалён из базы данных и с сервера!"
    }
}

prompt-admin-user-is-not-active {
    action-bar {
        text="Пользователь не активен на сервере!"
    }
}

prompt-admin-user-not-found {
    logout {
        text="Данные пользователя %1$s не найдены. Попросите его зарегистрироваться на сервере."
    }
}

prompt-admin-user-password-changed-successfully {
    action-bar {
        text="Пароль пользователя %1$s успешно изменён!"
    }
}

prompt-admin-user-session-destroyed {
    action-bar {
        text="Сессия пользователя %1$s уничтожена, он изгнан с сервера!"
    }
}

prompt-admin-who-is-user {
    message {
        text="Информация о '%1$s':\nUUID: %2$s\nПлатформа: %3$s\nРежим: %4$s\nIP-адрес: %5$s\nСтатус: %6$s\nЗарегистрирован оффлайн: %7$s\nСтрана: %8$s\nДата создания: %9$s\nАвторизован: %10$s"
    }
}

prompt-missing-parameter {
    action-bar {
        text="Отсутствует параметр '%1$s' в команде '%2$s'!"
