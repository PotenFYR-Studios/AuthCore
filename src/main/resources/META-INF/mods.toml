modLoader = "javafml"
loaderVersion = "${forgeLoaderRange}"
license = "Apache-2.0 WITH Commons-Clause-1.0"
issueTrackerURL = "https://github.com/PotenFYR-Studios/AuthCore/issues"

[[mods]]
modId = "authcore"
version = "${version}"
displayName = "${name}"
description = "${description}"
authors = "Ded3ec"
logoFile = "assets/authcore/icon.png"
# Server-only mod: without this the Forge default (MATCH_VERSION) flags every server running
# AuthCore with a red X in the client's multiplayer list, because the mod is present on the
# server and absent on the client. IGNORE_SERVER_VERSION is the documented value for this case
# and is exactly what a modpack player needs - the pack's client files stay untouched.
displayTest = "IGNORE_SERVER_VERSION"

# Forge applies the same mixin configs as the fabric build (loader-agnostic selectors).
[[mixins]]
config = "authcore.server.mixins.json"

[[dependencies.authcore]]
modId = "forge"
type = "required"
mandatory = true
versionRange = "${forgeRange}"
ordering = "NONE"
side = "SERVER"

# The whole group range (maven syntax), so Modrinth resolves the exact supported
# versions instead of the single build target.
[[dependencies.authcore]]
modId = "minecraft"
type = "required"
mandatory = true
versionRange = "${minecraftRangeForge}"
ordering = "NONE"
side = "SERVER"
