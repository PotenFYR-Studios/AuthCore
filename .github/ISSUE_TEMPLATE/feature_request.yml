name: ✨ Feature Request
description: Suggest an idea or capability for AuthCore.
title: "[Feature]: "
labels: ["enhancement", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Feature ideas are welcome! Please check the [roadmap section of the README](https://github.com/PotenFYR-Studios/AuthCore#-roadmap) and
        [existing issues](https://github.com/PotenFYR-Studios/AuthCore/issues?q=is%3Aissue+label%3Aenhancement) first -
        your idea may already be tracked. If your proposal touches security-sensitive behavior
        (authentication, sessions, proxy forwarding), explain the threat model.

  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: "What are you trying to achieve? What does AuthCore not let you do today?"
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: "What should happen, concretely? Commands, config keys, or behavior you envision."
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Authentication / login flow
        - Limbo lobby / captcha
        - Sessions / SSO (Redis)
        - Proxy support (Velocity / BungeeCord)
        - Web admin panel
        - Commands / permissions
        - Configuration / localization
        - Database / storage
        - Performance
        - Developer API
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches, workarounds, or plugins you have tried.
    validations:
      required: false

  - type: checkboxes
    id: willingness
    attributes:
      label: Willingness to contribute
      options:
        - label: I am willing to help test this feature.
        - label: I am willing to submit a pull request for this feature (see CONTRIBUTING.md).

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I searched existing issues and discussions for similar requests.
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
