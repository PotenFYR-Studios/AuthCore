name: 📚 Documentation
description: Report an issue with the docs at docs.potenfyr.in/repo/authcore or in the README.
title: "[Docs]: "
labels: ["documentation", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Found a typo, an outdated step, or a missing topic? Tell us where and what to change.
        The docs live in the unified PotenFYR documentation hub (docs.potenfyr.in/repo/authcore).

  - type: dropdown
    id: page
    attributes:
      label: Where is the problem?
      options:
        - Documentation hub (https://docs.potenfyr.in/repo/authcore)
        - Admin guide (https://docs.potenfyr.in/repo/authcore/guide)
        - Authentication flows (https://docs.potenfyr.in/repo/authcore/flows)
        - Configuration reference (https://docs.potenfyr.in/repo/authcore/config)
        - Proxy support (https://docs.potenfyr.in/repo/authcore/proxy)
        - Web admin panel (https://docs.potenfyr.in/repo/authcore/webpanel)
        - Security model (https://docs.potenfyr.in/repo/authcore/security)
        - 26.x builds & migration (https://docs.potenfyr.in/repo/authcore/26x)
        - Developer API (https://docs.potenfyr.in/repo/authcore/api)
        - Development & architecture (https://docs.potenfyr.in/repo/authcore/development)
        - Changelog (https://docs.potenfyr.in/repo/authcore/changelog)
        - License (https://docs.potenfyr.in/repo/authcore/license)
        - README.md
        - Other / not listed
    validations:
      required: true

  - type: dropdown
    id: type
    attributes:
      label: Type of issue
      options:
        - Typo / formatting
        - Unclear or confusing explanation
        - Missing information
        - Outdated / wrong information
        - Broken link
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current text or section
      description: Quote the text or describe the section (or paste the URL anchor).
    validations:
      required: true

  - type: textarea
    id: suggested
    attributes:
      label: Suggested improvement
      description: What should it say instead? If you know the correct behavior from your own setup, include it.
    validations:
      required: true

  - type: checkboxes
    id: checks
    attributes:
      label: Final checks
      options:
        - label: I checked the latest version of the docs (hard refresh / current release).
          required: true
        - label: This is not a security vulnerability (those go through SECURITY.md).
          required: true
