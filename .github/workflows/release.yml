name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-release-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-release-

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> $GITHUB_OUTPUT

      - name: Build release jars
        run: ./gradlew clean build

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VER="${{ steps.version.outputs.version }}"
          awk -v ver="[$VER]" '
            $0 ~ "^## " { in_section = ($0 ~ ver) ; next }
            in_section && $0 ~ "^## " { exit }
            in_section { print }
          ' changelogs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "No changelog section found for [$VER] - using the top section" >&2
            awk 'BEGIN{in_section=0} /^## /{in_section=1;next} in_section&&/^## /{exit} in_section{print}' changelogs/changelog.md > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AuthCore ${{ steps.version.outputs.version }}
          body_path: release-notes.md
          files: |
            build/libs/authcore-*.jar
          draft: true
