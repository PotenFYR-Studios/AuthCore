name: Deploy docs to GitHub Pages

# Static documentation site:
#   /                    -> common main page (index.html, version-agnostic)
#   /docs/versions.json  -> version registry (drives the version switcher + cards)
#   /docs/<version>/...  -> per-release documentation sets
#
# Stages exactly those files into site/ (never the repository source) and
# deploys with the official Pages actions.

on:
  push:
    branches: [ master ]
    paths:
      - index.html
      - favicon.png
      - robots.txt
      - sitemap.xml
      - llms.txt
      - og.png
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Build docs app (Vite + React + TS)
        working-directory: docs/app
        run: |
          bun install --frozen-lockfile
          bun run build

      - name: Stage site (main page + built docs app)
        run: |
          mkdir -p site/docs
          cp index.html site/index.html
          cp favicon.png site/favicon.png
          cp robots.txt site/robots.txt
          cp sitemap.xml site/sitemap.xml
          cp llms.txt site/llms.txt
          cp og.png site/og.png
          cp CNAME site/CNAME
          cp LICENSE site/LICENSE
          cp docs/versions.json site/docs/versions.json
          cp -r docs/app/dist/. site/docs/
          ls -R site | head -40

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
