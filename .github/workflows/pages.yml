name: Deploy docs to GitHub Pages

# Static documentation site:
#   /                    -> common main page (index.html, version-agnostic)
#   /docs/versions.json  -> version registry (drives the version switcher + cards)
#   /docs/<version>/...  -> per-release documentation sets
#
# Stages exactly those files into site/ (never the repository source) and
# deploys with the official Pages actions.

on:
  push:
    branches: [ main ]
    paths:
      - index.html
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Stage site (main page + docs/)
        run: |
          mkdir -p site/docs
          cp index.html site/index.html
          cp -r docs/. site/docs/
          ls -R site | head -40

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
