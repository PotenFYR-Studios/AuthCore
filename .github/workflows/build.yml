on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build mod (modern target)
        run: ./gradlew build

      - name: Run security & business-logic tests
        run: pwsh -File tools/security-tests/run-tests.ps1

      - name: Verify universal source against Minecraft 1.16.5
        run: |
          ./gradlew build
          # Rebuild the identical source against the legacy target to prove universal compatibility
          sed -i 's/minecraft_version=1.21.11/minecraft_version=1.16.5/; s|yarn_mappings=1.21.11+build.4|yarn_mappings=1.16.5+build.10|; s/loader_version=0.18.4/loader_version=0.14.24/; s/fabric_api_version=0.141.3+1.21.11/fabric_api_version=0.42.0+1.16/' gradle.properties
          ./gradlew clean build
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: mod-jar
          path: build/libs/*.jar
