name: CI

# ONE workflow, FIVE jobs - cross-connected so nothing builds twice:
#   build       - builds the SEVEN variants (3 ranges x fabric/forge/neoforge) IN PARALLEL
#                 via a matrix (one runner per variant), verifies each jar's role, runs
#                 the security test suite once on the primary variant, uploads per-variant
#                 jar artifacts
#   merge       - needs build: collects all seven jars, enforces the exact-count gate +
#                 full role verification, publishes the shared "authcore-jars" artifact
#   host-tests  - needs merge: downloads the jars (no rebuild) and runs the Docker
#                 harness (smoke on push/PR, full range matrix on workflow_dispatch)
#   release     - needs merge, v* tags only: publishes/updates the STABLE release
#                 for the tag (jars + changelog section)
#   dev-release - needs merge, pushes to main only: refreshes a rolling "latest"
#                 PRERELEASE with the newest jars of every commit, so up-to-date
#                 development builds are always downloadable from GitHub Releases.
#                 Marked prerelease + not-"Latest" so it never shadows stable ones.
#
# Speed notes: the matrix cuts wall-clock build time roughly by the variant count
# (each leg compiles one Stonecutter variant); Gradle deps + build cache are persisted
# between runs (setup-java cache + org.gradle.caching), so re-pushing a tag or
# rebuilding after a small change reuses most of the work. Note: a rare "Set up job"
# failure is GitHub runner infrastructure, NOT this repo - simply re-run the failed job.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tagged build mid-release; branch builds are safe to supersede.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; jobs that need write access declare it explicitly.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        variant:
          - 1.18.2-fabric
          - 1.18.2-forge
          - 1.21.11-fabric
          - 1.21.11-forge
          - 1.21.11-neoforge
          - 26.2-fabric
          - 26.2-neoforge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17 + JDK 21 + JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build variant ${{ matrix.variant }}
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :${{ matrix.variant }}:build --no-daemon --stacktrace

      - name: Stage jar
        run: |
          mkdir -p release
          cp versions/${{ matrix.variant }}/build/libs/authcore-*.jar release/
          rm -f release/*sources*.jar
          ls -la release/

      - name: Verify jar role (${{ matrix.variant }})
        run: |
          STATUS=0
          for JAR in release/authcore-*.jar; do
            echo "== $JAR =="
            CHECKS=(
              'net/ded3ec/AuthCoreServer.class|server entrypoint'
              'bungee.yml|bungee manifest'
              'velocity-plugin.json|velocity manifest'
            )
            for ENTRY in "${CHECKS[@]}"; do
              PATTERN="${ENTRY%%|*}"; LABEL="${ENTRY##*|}"
              if unzip -l "$JAR" | grep -q "$PATTERN"; then
                echo "  OK $LABEL"
              else
                echo "::error::$JAR missing $LABEL"
                STATUS=1
              fi
            done
            if unzip -l "$JAR" | grep -q 'fabric.mod.json'; then
              unzip -p "$JAR" fabric.mod.json | grep -q '"environment": "server"' \
                && echo "  OK fabric env server" || { echo "::error::$JAR wrong fabric environment"; STATUS=1; }
            fi
            for TOML in META-INF/neoforge.mods.toml META-INF/mods.toml; do
              if unzip -l "$JAR" | grep -q "$TOML"; then
                unzip -p "$JAR" "$TOML" | grep -q 'modId = "authcore"' \
                  && echo "  OK $TOML metadata" || { echo "::error::$JAR bad $TOML"; STATUS=1; }
              fi
            done
          done
          exit $STATUS

      # The standalone security suite compiles against the REAL compiled classes, which
      # only exist inside a build leg - run it once on the primary (vcsVersion) variant.
      # The Gradle export task provides the EXACT variant classpath (a CI leg's global
      # cache has no standalone copies of transitive libs like slf4j-api/commons-lang3),
      # and PATH is pinned to JDK 21+ so javac can read Java-21 classfiles regardless of
      # which setup-java version ended up default.
      - name: Export security-test classpath
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :${{ matrix.variant }}:exportSecurityTestLibs --no-daemon -q

      - name: Run security & business-logic tests
        if: matrix.variant == '1.21.11-fabric'
        run: |
          export PATH="${JAVA_HOME_21_X64:-$JAVA_HOME_25_X64}/bin:$PATH"
          pwsh -NoProfile -File tools/security-tests/run-tests.ps1

      - name: Upload variant jars
        uses: actions/upload-artifact@v4
        with:
          name: jars-${{ matrix.variant }}
          path: release/*.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports-${{ matrix.variant }}
          path: |
            versions/${{ matrix.variant }}/build/reports/
            versions/${{ matrix.variant }}/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Collect all seven variant jars into one verified artifact that the
  # host-test harness, the stable release and the dev release consume.
  # ------------------------------------------------------------------
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
    steps:
      - name: Collect variant jars
        uses: actions/download-artifact@v4
        with:
          pattern: jars-*
          merge-multiple: true
          path: release

      - name: Verify jar count (7 variants expected)
        run: |
          COUNT=$(ls release/authcore-*.jar | wc -l)
          echo "Found $COUNT jars"
          if [ "$COUNT" -ne 7 ]; then
            echo "::error::Expected exactly 7 release jars, found $COUNT"
            exit 1
          fi
          ls -la release/

      - name: Upload merged jars (shared with host-tests, release and dev-release)
        uses: actions/upload-artifact@v4
        with:
          name: authcore-jars
          path: release/*.jar
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Docker compatibility harness: real servers, real boots.
  # Downloads the jars from `build` (never rebuilds).
  # ------------------------------------------------------------------
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: merge
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: authcore-jars
          path: dist

      # Speed: persist the harness downloads + installed server state between
      # runs (JBR tarballs, Fabric server launcher jars, vanilla servers,
      # Forge/NeoForge installer jars + extracted libraries, Fabric API jars).
      # The full matrix then skips almost every download and installer run.
      - name: Restore harness caches (JBR tarballs + server files)
        uses: actions/cache@v4
        with:
          path: |
            tools/host-tests/.cache
            tools/host-tests/work
          key: hosttests-${{ runner.os }}-${{ hashFiles('tools/host-tests/versions.json', 'versions/dependencies/*.properties') }}
          restore-keys: |
            hosttests-${{ runner.os }}-

      - name: Host-compatibility smoke (push/PR only, build targets)
        if: github.event_name != 'workflow_dispatch'
        run: |
          pwsh -NoProfile -File tools/host-tests/run-host-tests.ps1 -Smoke -Parallel 4
        env:
          DOCKER_BUILDKIT: '1'

      - name: Full range-endpoint matrix (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        run: |
          pwsh -NoProfile -File tools/host-tests/run-host-tests.ps1 -Parallel 4
        env:
          DOCKER_BUILDKIT: '1'

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-report
          path: |
            tools/host-tests/reports/latest.md
            tools/host-tests/reports/latest.html
            tools/host-tests/reports/latest.json

  # ------------------------------------------------------------------
  # Stable release: waits for build (the jars are the artifact), then replaces
  # the release for the SAME tag (delete old release + assets) or creates
  # a new one for a different version. Publishes the jars + the changelog
  # entry. Deliberately does NOT wait for host-tests: releases appear as
  # soon as the build finishes while the harness validates in parallel.
  # ------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: merge
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validated jars
        uses: actions/download-artifact@v4
        with:
          name: authcore-jars
          path: release

      - name: Extract changelog section for this version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Match the EXACT version bracket: "[1.0.0]" must not match
          # "[1.0.0-alpha.5]" (substring bug). Compare the heading's bracket
          # field literally, so only sections for the tagged version are used.
          awk -v ver="$VER" '
            /^## / {
              field = $2
              if (field == "[" ver "]") { in_section = 1; next }
              else if (in_section) exit
              next
            }
            in_section { print }
          ' changelogs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release of AuthCore $VER - see changelogs/changelog.md for details." > release-notes.md
          fi
          ls -la release/

      - name: Publish or update the GitHub Release for this version
        # Existing release for the same tag = same version: replace the notes and
        # re-upload the jars with --clobber (old assets are overwritten, nothing
        # lingers). A different tag creates a brand new release. Never deletes
        # first, so a failed publish cannot leave the release missing.
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - updating notes and replacing assets."
            gh release upload "$TAG" release/*.jar --clobber
            gh release edit "$TAG" --notes-file release-notes.md --latest=true
          else
            echo "Release $TAG does not exist - creating it."
            gh release create "$TAG" \
              release/*.jar \
              --title "AuthCore $TAG" \
              --notes-file release-notes.md \
              --latest=true
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

      # ------------------------------------------------------------------
      # Modrinth publishing (idempotent, same-version rebuilds replace cleanly).
      #
      # One listing PER MINECRAFT RANGE (Modrinth attaches game versions per version,
      # not per file), each with its correct loaders + dependencies:
      #   <ver>+mc1.16-1.18  fabric+forge             >=1.16 <=1.18.2
      #   <ver>+mc1.19-1.21  fabric+forge+neoforge    >=1.19 <=1.21.11
      #   <ver>+mc26.1-26.2  fabric+neoforge          26.1-26.2
      # Rebuilding the SAME tag deletes any existing listing with the same version
      # number first and re-creates it with fresh jars + the freshly extracted
      # changelog - mirroring the GitHub Release upsert above.
      # Setup: add a repo secret MODRINTH_TOKEN (token with write access) and
      # optionally a repo variable MODRINTH_PROJECT_ID (slug or id; defaults to
      # "authcore"). Without the token the steps skip silently.
      # ------------------------------------------------------------------
      - name: Prepare Modrinth publish
        id: modrinth
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -z "$MODRINTH_TOKEN" ]; then
            echo "MODRINTH_TOKEN not set - skipping Modrinth publishing."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            # Pre-release tags (e.g. v1.0.0-beta.2) publish as beta on Modrinth.
            if [[ "$VER" == *-* ]]; then TYPE=beta; else TYPE=release; fi
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "version_type=$TYPE" >> "$GITHUB_OUTPUT"
            echo "version=$VER" >> "$GITHUB_OUTPUT"
          fi

      - name: Delete stale Modrinth versions (same-version rebuild)
        if: steps.modrinth.outputs.enabled == 'true'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_PROJECT_ID || 'authcore' }}
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Every range listing of this version starts with the bare version number.
          IDS=$(curl -sf -H "Authorization: Bearer $MODRINTH_TOKEN" \
            "https://api.modrinth.com/v2/project/$MODRINTH_ID/version" \
            | jq -r --arg v "$VER" '.[] | select(.version_number | startswith($v)) | .id')
          if [ -n "$IDS" ]; then
            for ID in $IDS; do
              echo "Deleting stale Modrinth version $ID (rebuild of $VER)."
              curl -sf -X DELETE -H "Authorization: Bearer $MODRINTH_TOKEN" \
                "https://api.modrinth.com/v2/version/$ID"
            done
          else
            echo "No existing Modrinth listings for $VER - creating fresh."
          fi

      - name: Publish Minecraft 1.16-1.18 jars to Modrinth
        if: steps.modrinth.outputs.enabled == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID || 'authcore' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            release/authcore-1.16-1.18-fabric-*.jar
            release/authcore-1.16-1.18-forge-*.jar
          name: AuthCore ${{ github.ref_name }} (Minecraft 1.16-1.18)
          version-type: ${{ steps.modrinth.outputs.version_type }}
          version: ${{ steps.modrinth.outputs.version }}+mc1.16-1.18
          loaders: fabric forge
          game-versions: ">=1.16 <=1.18.2"
          java: 17
          dependencies: |
            fabric-api:required
          changelog-file: release-notes.md

      - name: Publish Minecraft 1.19-1.21 jars to Modrinth
        if: steps.modrinth.outputs.enabled == 'true'
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID || 'authcore' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            release/authcore-1.19-1.21-fabric-*.jar
            release/authcore-1.19-1.21-forge-*.jar
            release/authcore-1.19-1.21-neoforge-*.jar
          name: AuthCore ${{ github.ref_name }} (Minecraft 1.19-1.21)
          version-type: ${{ steps.modrinth.outputs.version_type }}
          version: ${{ steps.modrinth.outputs.version }}+mc1.19-1.21
          loaders: fabric forge neoforge
          game-versions: ">=1.19 <=1.21.11"
          java: 21
          dependencies: |
            fabric-api:required
          changelog-file: release-notes.md

      # continue-on-error: the modern-era (26.x) game-version entries may not exist on
      # Modrinth yet - a resolution failure there must not fail an otherwise-good release.
      - name: Publish Minecraft 26.x jars to Modrinth
        if: steps.modrinth.outputs.enabled == 'true'
        continue-on-error: true
        uses: Kir-Antipov/mc-publish@v3.3
        with:
          modrinth-id: ${{ vars.MODRINTH_PROJECT_ID || 'authcore' }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          files: |
            release/authcore-26.1-26.2-fabric-*.jar
            release/authcore-26.1-26.2-neoforge-*.jar
          name: AuthCore ${{ github.ref_name }} (Minecraft 26.1-26.2)
          version-type: ${{ steps.modrinth.outputs.version_type }}
          version: ${{ steps.modrinth.outputs.version }}+mc26.1-26.2
          loaders: fabric neoforge
          game-versions: 26.1 26.2
          java: 25
          dependencies: |
            fabric-api:required
          changelog-file: release-notes.md

  # ------------------------------------------------------------------
  # Rolling development build: every push to main refreshes the "latest"
  # prerelease so current builds are ALWAYS available from GitHub Releases
  # without cutting a version tag. Assets are replaced with --clobber;
  # notes carry the exact commit so users can pin/report precisely.
  # The release stays marked prerelease and NOT "Latest", so it can never
  # shadow a stable v* release.
  # ------------------------------------------------------------------
  dev-release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: merge
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: write
    steps:
      # gh resolves the repository through git remotes (newer runner builds fail with
      # "fatal: not a git repository" otherwise) - check out AND set GH_REPO explicitly.
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download built jars
        uses: actions/download-artifact@v4
        with:
          name: authcore-jars
          path: release

      - name: Publish rolling dev build ("latest")
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          TAG="latest"
          SHORT="${GITHUB_SHA::7}"
          TITLE="Development build (${SHORT})"
          cat > dev-notes.md <<EOF
          > ⚠️ **Automated development build** of commit [\`${SHORT}\`](https://github.com/${GITHUB_REPOSITORY}/commit/${GITHUB_SHA}) - may be unstable.
          > For production use the newest **stable** release instead.

          **Commit:** ${COMMIT_MSG:-n/a}

          ### Jars
          | Jar | Minecraft | Loader | Java |
          |:----|:----------|:-------|:-----|
          EOF
          # Robust name parsing: authcore-<range>-<loader>-<version>.jar where <range>
          # contains dots but never dashes and <version> is dash-free. The old cut-based
          # field indexing broke on any label shape other than N.N-N.N (e.g. "27.0+").
          for JAR in release/authcore-*.jar; do
            BASE=$(basename "$JAR" .jar)
            REST=${BASE#authcore-}     # <range>-<loader>-<version>
            VER=${REST##*-}            # <version>
            MID=${REST%-"$VER"}        # <range>-<loader>
            LOADER=${MID##*-}          # <loader>
            RANGE=${MID%-"$LOADER"}    # <range>
            case "$RANGE" in
              1.16*|1.18*) JAVA=17 ;;
              1.19*|1.21*) JAVA=21 ;;
              *) JAVA=25 ;;
            esac
            echo "| \`$BASE.jar\` | $RANGE | $LOADER | $JAVA |" >> dev-notes.md
          done
          cat >> dev-notes.md <<EOF

          **Install:** drop ONE jar matching your Minecraft range + loader into \`mods/\`.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Dev release exists - replacing assets and notes."
            gh release upload "$TAG" release/*.jar --clobber
            gh release edit "$TAG" --title "$TITLE" --notes-file dev-notes.md --prerelease --latest=false
          else
            echo "Creating rolling dev release."
            gh release create "$TAG" \
              release/*.jar \
              --title "$TITLE" \
              --notes-file dev-notes.md \
              --prerelease
          fi
