name: CI

# ONE workflow, THREE jobs - minimal notifications:
#   build   - builds BOTH jars (authcore-classic for 1.16-1.21.11, authcore-modern for 26.1+),
#             verifies them and runs the security test suite
#   matrix  - single job that compiles the source against 1.16.5 ... 1.21.11
#   release - on v* tags: builds both jars and publishes/updates the GitHub Release with them
#             (re-running the same tag UPDATES the existing release + assets + changelog body)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 + JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build classic universal jar (1.16 - 1.21.11)
        run: ./gradlew clean build

      - name: Stage classic jar (before the modern build cleans build/)
        run: |
          mkdir -p release
          cp $(ls build/libs/authcore-classic-*.jar | grep -v sources) release/

      - name: Verify classic jar (all 3 roles)
        run: |
          JAR=$(ls release/authcore-classic-*.jar | grep -v sources | head -1)
          echo "jar: $JAR"
          # SERVER role (Fabric)
          unzip -p "$JAR" fabric.mod.json | grep -q '"environment": "\*"' && echo "OK server+client environment"
          unzip -p "$JAR" fabric.mod.json | grep -q '"minecraft": ">=1.16.0"' && echo "OK declares 1.16.0+"
          unzip -l "$JAR" | grep -q 'net/ded3ec/AuthCoreServer.class' && echo "OK server entrypoint class"
          MAJOR=$(unzip -p "$JAR" net/ded3ec/AuthCoreServer.class | head -c 8 | od -An -t u1 -j 6 -N 2 | awk '{print $1*256+$2}')
          [ "$MAJOR" -le 60 ] && echo "OK class major $MAJOR (Java 16, runs on any newer JVM)" || { echo "FAIL major $MAJOR"; exit 1; }
          # CLIENT role (Fabric companion)
          unzip -p "$JAR" fabric.mod.json | grep -q 'net.ded3ec.client.ClientAuthCore' && echo "OK client entrypoint"
          unzip -l "$JAR" | grep -q 'net/ded3ec/client/ClientAuthCore.class' && echo "OK client companion bundled"
          # PROXY role (BungeeCord + Velocity)
          unzip -l "$JAR" | grep -q 'bungee.yml' && echo "OK bungee.yml manifest"
          unzip -l "$JAR" | grep -q 'net/ded3ec/proxy/BungeeEntry.class' && echo "OK BungeeCord entry class"
          unzip -l "$JAR" | grep -q 'velocity-plugin.json' && echo "OK velocity-plugin.json manifest"
          unzip -l "$JAR" | grep -q 'net/ded3ec/proxy/VelocityEntry.class' && echo "OK Velocity entry class"

      - name: Build 26.x jar (26.1+)
        run: ./gradlew build -Pmodern=true -Pfabric.loom.disableObfuscation=true
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - name: Stage modern jar
        run: cp $(ls build/libs/authcore-modern-*.jar | grep -v sources) release/

      - name: Verify 26.x jar (all 3 roles)
        run: |
          JAR=$(ls release/authcore-modern-*.jar | grep -v sources | head -1)
          echo "jar: $JAR"
          # SERVER role (Fabric, unobfuscated era)
          unzip -p "$JAR" fabric.mod.json | grep -q '"environment": "\*"' && echo "OK server+client environment"
          unzip -p "$JAR" fabric.mod.json | grep -q '"minecraft": ">=26.1"' && echo "OK declares 26.1+"
          unzip -p "$JAR" fabric.mod.json | grep -q '"java": ">=25"' && echo "OK declares Java 25"
          unzip -l "$JAR" | grep -q 'net/ded3ec/AuthCoreServer.class' && echo "OK server entrypoint class"
          MAJOR=$(unzip -p "$JAR" net/ded3ec/AuthCoreServer.class | head -c 8 | od -An -t u1 -j 6 -N 2 | awk '{print $1*256+$2}')
          [ "$MAJOR" -eq 69 ] && echo "OK class major $MAJOR (Java 25)" || { echo "FAIL major $MAJOR"; exit 1; }
          # CLIENT role (Fabric companion)
          unzip -p "$JAR" fabric.mod.json | grep -q 'net.ded3ec.client.ClientAuthCore' && echo "OK client entrypoint"
          unzip -l "$JAR" | grep -q 'net/ded3ec/client/ClientAuthCore.class' && echo "OK client companion bundled"
          # PROXY role (BungeeCord + Velocity)
          unzip -l "$JAR" | grep -q 'bungee.yml' && echo "OK bungee.yml manifest"
          unzip -l "$JAR" | grep -q 'net/ded3ec/proxy/BungeeEntry.class' && echo "OK BungeeCord entry class"
          unzip -l "$JAR" | grep -q 'velocity-plugin.json' && echo "OK velocity-plugin.json manifest"
          unzip -l "$JAR" | grep -q 'net/ded3ec/proxy/VelocityEntry.class' && echo "OK Velocity entry class"

      - name: Run security & business-logic tests
        run: pwsh -File tools/security-tests/run-tests.ps1

      - name: Upload both jars
        uses: actions/upload-artifact@v4
        with:
          name: authcore-jars
          path: release/*.jar

  matrix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Compile the source against every supported version
        run: |
          failures=()
          for row in \
            "1.16.5 1.16.5+build.10 0.14.24 0.42.0+1.16" \
            "1.17.1 1.17.1+build.65 0.14.24 0.46.1+1.17" \
            "1.18.2 1.18.2+build.4 0.14.24 0.77.0+1.18.2" \
            "1.19.4 1.19.4+build.2 0.15.11 0.87.2+1.19.4" \
            "1.20.6 1.20.6+build.3 0.15.11 0.100.8+1.20.6" \
            "1.21.11 1.21.11+build.6 0.18.4 0.141.3+1.21.11"; do
            read -r mc yarn loader api <<< "$row"
            sed -i \
              -e "s/^minecraft_version=.*/minecraft_version=$mc/" \
              -e "s/^yarn_mappings=.*/yarn_mappings=$yarn/" \
              -e "s/^loader_version=.*/loader_version=$loader/" \
              -e "s/^fabric_api_version=.*/fabric_api_version=$api/" \
              gradle.properties
            echo "== compiling against Minecraft $mc =="
            if ./gradlew clean build -Puniversal=false > "build-$mc.log" 2>&1; then
              echo "PASS $mc"
            else
              echo "FAIL $mc"
              grep -E "error:" "build-$mc.log" | head -10 || true
              failures+=("$mc")
            fi
          done
          if [ ${#failures[@]} -gt 0 ]; then
            echo "Compile failures: ${failures[*]}"
            exit 1
          fi

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: matrix-logs
          path: build-*.log

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21 + JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            21
            25

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build classic jar (1.16 - 1.21.11)
        run: ./gradlew clean build

      - name: Stage classic jar
        run: |
          mkdir -p release
          cp $(ls build/libs/authcore-classic-*.jar | grep -v sources) release/

      - name: Build 26.x jar (26.1+)
        run: ./gradlew build -Pmodern=true -Pfabric.loom.disableObfuscation=true
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_25_X64 }}

      - name: Stage modern jar
        run: cp $(ls build/libs/authcore-modern-*.jar | grep -v sources) release/

      - name: Extract changelog section for this version
        id: changelog
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Literal (non-regex) match of "[<VER>]" - only the section for THIS version is
          # extracted; other versions never leak into the release notes.
          awk -v ver="$VER" '
            /^## / {
              if (index($0, "[" ver "]") > 0) { in_section = 1; next }
              else if (in_section) exit
              next
            }
            in_section { print }
          ' changelogs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release of AuthCore $VER - see changelogs/changelog.md for details." > release-notes.md
          fi
          echo "--- release notes ---"
          cat release-notes.md

      - name: Create or update GitHub Release with both jars
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: AuthCore ${{ github.ref_name }}
          body_path: release-notes.md
          files: |
            release/authcore-classic-1.0.0.jar
            release/authcore-modern-1.0.0.jar
          draft: false
          update_release_body: true
          overwrite: true
          fail_on_unmatched_files: false
