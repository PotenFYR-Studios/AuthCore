name: CI

# ONE workflow, THREE jobs - cross-connected so nothing builds twice:
#   build     - builds ALL SEVEN variants (3 ranges x fabric/forge/neoforge) via
#               Stonecutter, verifies jar roles, runs the security test suite,
#               uploads the jars as an artifact
#   host-tests - needs build: downloads the jars (no rebuild) and runs the Docker
#               harness (smoke on push/PR, full range matrix on schedule)
#   release   - needs build: downloads the validated jars, replaces the release for
#               the same tag (or creates a new one), publishes the changelog.
#               Only runs on v* tags. Does NOT wait for host-tests so a release
#               appears as soon as the jars are built; host-tests still validates
#               in parallel in the same run.
# Speed notes: Gradle deps + build cache are persisted between runs (setup-java
# cache + org.gradle.caching), so re-pushing a tag or rebuilding after a small
# change reuses most of the work.

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'   # daily UTC 04:00 (full range-endpoint matrix)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 + JDK 21 + JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build all variants (1.18.2/1.21.11/26.2 x fabric/forge/neoforge)
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :1.18.2-fabric:build :1.18.2-forge:build \
            :1.21.11-fabric:build :1.21.11-forge:build :1.21.11-neoforge:build \
            :26.2-fabric:build :26.2-neoforge:build

      - name: Stage all jars
        run: |
          mkdir -p release
          cp versions/*/build/libs/authcore-*.jar release/
          rm -f release/*sources*.jar
          ls -la release/

      - name: Verify jar roles (server / client / proxy)
        run: |
          for JAR in release/authcore-*.jar; do
            echo "== $JAR =="
            unzip -l "$JAR" | grep -q 'net/ded3ec/AuthCoreServer.class' && echo "  OK server entrypoint"
            unzip -l "$JAR" | grep -q 'net/ded3ec/client/ClientAuthCore.class' && echo "  OK client companion"
            unzip -l "$JAR" | grep -q 'bungee.yml' && echo "  OK bungee manifest"
            unzip -l "$JAR" | grep -q 'velocity-plugin.json' && echo "  OK velocity manifest"
            if unzip -l "$JAR" | grep -q 'fabric.mod.json'; then
              unzip -p "$JAR" fabric.mod.json | grep -q '"environment": "\*"' && echo "  OK fabric env *"
            fi
            if unzip -l "$JAR" | grep -q 'META-INF/neoforge.mods.toml'; then
              unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q 'modId = "authcore"' && echo "  OK neoforge metadata"
            fi
            if unzip -l "$JAR" | grep -q 'META-INF/mods.toml'; then
              unzip -p "$JAR" META-INF/mods.toml | grep -q 'modId = "authcore"' && echo "  OK forge metadata"
            fi
          done

      - name: Run security & business-logic tests
        run: pwsh -File tools/security-tests/run-tests.ps1

      - name: Upload jars (shared with host-tests and release)
        uses: actions/upload-artifact@v4
        with:
          name: authcore-jars
          path: release/*.jar
          retention-days: 7

  # ------------------------------------------------------------------
  # Docker compatibility harness: real servers, real boots.
  # Downloads the jars from `build` (never rebuilds).
  # ------------------------------------------------------------------
  host-tests:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download jars
        uses: actions/download-artifact@v4
        with:
          name: authcore-jars
          path: dist

      # Speed: persist the harness downloads + installed server state between
      # runs (JBR tarballs, Fabric server launcher jars, vanilla servers,
      # Forge/NeoForge installer jars + extracted libraries, Fabric API jars).
      # The full matrix then skips almost every download and installer run.
      - name: Restore harness caches (JBR tarballs + server files)
        uses: actions/cache@v4
        with:
          path: |
            tools/host-tests/.cache
            tools/host-tests/work
          key: hosttests-${{ runner.os }}-${{ hashFiles('tools/host-tests/versions.json', 'versions/dependencies/*.properties') }}
          restore-keys: |
            hosttests-${{ runner.os }}-

      - name: Host-compatibility smoke (push/PR only, build targets)
        if: github.event_name != 'schedule' && github.event_name != 'workflow_dispatch'
        run: |
          pwsh -NoProfile -File tools/host-tests/run-host-tests.ps1 -Smoke -Parallel 4
        env:
          DOCKER_BUILDKIT: '1'

      - name: Full range-endpoint matrix (scheduled runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pwsh -NoProfile -File tools/host-tests/run-host-tests.ps1 -Parallel 4
        env:
          DOCKER_BUILDKIT: '1'

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-report
          path: |
            tools/host-tests/reports/latest.md
            tools/host-tests/reports/latest.html
            tools/host-tests/reports/latest.json

  # ------------------------------------------------------------------
  # Release: waits for build (the jars are the artifact), then replaces
  # the release for the SAME tag (delete old release + assets) or creates
  # a new one for a different version. Publishes the jars + the changelog
  # entry. Deliberately does NOT wait for host-tests: releases appear as
  # soon as the build finishes while the harness validates in parallel.
  # ------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download validated jars
        uses: actions/download-artifact@v4
        with:
          name: authcore-jars
          path: release

      - name: Extract changelog section for this version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Match the EXACT version bracket: "[1.0.0]" must not match
          # "[1.0.0-alpha.5]" (substring bug). Compare the heading's bracket
          # field literally, so only sections for the tagged version are used.
          awk -v ver="$VER" '
            /^## / {
              field = $2
              if (field == "[" ver "]") { in_section = 1; next }
              else if (in_section) exit
              next
            }
            in_section { print }
          ' changelogs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release of AuthCore $VER - see changelogs/changelog.md for details." > release-notes.md
          fi
          ls -la release/

      - name: Publish or update the GitHub Release for this version
        # Existing release for the same tag = same version: replace the notes and
        # re-upload the jars with --clobber (old assets are overwritten, nothing
        # lingers). A different tag creates a brand new release. Never deletes
        # first, so a failed publish cannot leave the release missing.
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - updating notes and replacing assets."
            gh release upload "$TAG" release/*.jar --clobber
            gh release edit "$TAG" --notes-file release-notes.md
          else
            echo "Release $TAG does not exist - creating it."
            gh release create "$TAG" \
              release/*.jar \
              --title "AuthCore $TAG" \
              --notes-file release-notes.md
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
