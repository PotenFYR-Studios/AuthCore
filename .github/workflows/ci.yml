name: CI

# ONE workflow, THREE jobs - minimal notifications:
#   build   - builds ALL SEVEN variants (3 ranges x fabric/forge/neoforge) via
#             Stonecutter (chiseledBuild), verifies the jar roles and runs the
#             security test suite
#   host-tests - Docker-based compatibility harness: boots every range jar on its
#             build targets (and range endpoints on schedule/dispatch)
#   release - on v* tags: builds all variants and publishes the range jars to the
#             GitHub Release (re-running the same tag UPDATES it)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'   # daily UTC 04:00 (full range-endpoint matrix)

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 + JDK 21 + JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build all variants (1.18.2/1.21.11/26.2 x fabric/forge/neoforge)
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :1.18.2-fabric:build :1.18.2-forge:build \
            :1.21.11-fabric:build :1.21.11-forge:build :1.21.11-neoforge:build \
            :26.2-fabric:build :26.2-neoforge:build

      - name: Stage all jars
        run: |
          mkdir -p release
          cp versions/*/build/libs/authcore-*.jar release/
          rm -f release/*sources*.jar
          ls -la release/

      - name: Verify jar roles (server / client / proxy)
        run: |
          for JAR in release/authcore-*.jar; do
            echo "== $JAR =="
            unzip -l "$JAR" | grep -q 'net/ded3ec/AuthCoreServer.class' && echo "  OK server entrypoint"
            unzip -l "$JAR" | grep -q 'net/ded3ec/client/ClientAuthCore.class' && echo "  OK client companion"
            unzip -l "$JAR" | grep -q 'bungee.yml' && echo "  OK bungee manifest"
            unzip -l "$JAR" | grep -q 'velocity-plugin.json' && echo "  OK velocity manifest"
            if unzip -l "$JAR" | grep -q 'fabric.mod.json'; then
              unzip -p "$JAR" fabric.mod.json | grep -q '"environment": "\*"' && echo "  OK fabric env *"
            fi
            if unzip -l "$JAR" | grep -q 'META-INF/neoforge.mods.toml'; then
              unzip -p "$JAR" META-INF/neoforge.mods.toml | grep -q 'modId = "authcore"' && echo "  OK neoforge metadata"
            fi
            if unzip -l "$JAR" | grep -q 'META-INF/mods.toml'; then
              unzip -p "$JAR" META-INF/mods.toml | grep -q 'modId = "authcore"' && echo "  OK forge metadata"
            fi
          done

      - name: Run security & business-logic tests
        run: pwsh -File tools/security-tests/run-tests.ps1

      - name: Upload jars
        uses: actions/upload-artifact@v4
        with:
          name: authcore-jars
          path: release/*.jar

  # ------------------------------------------------------------------
  # Docker compatibility harness: real servers, real boots.
  # On PR/push: build targets only (fast). On schedule/dispatch: the
  # full range-endpoint matrix (1.16.5 .. 26.2).
  # ------------------------------------------------------------------
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 + JDK 21 + JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Set up PowerShell 7
        uses: actions/setup-powershell@v2

      - name: Build all variants
        run: |
          chmod +x ./gradlew
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :1.18.2-fabric:build :1.18.2-forge:build \
            :1.21.11-fabric:build :1.21.11-forge:build :1.21.11-neoforge:build \
            :26.2-fabric:build :26.2-neoforge:build
          mkdir -p dist
          cp versions/*/build/libs/authcore-*.jar dist/
          rm -f dist/*sources*.jar

      - name: Host-compatibility smoke (build targets, all loaders)
        run: |
          pwsh -NoProfile -File tools/host-tests/run-host-tests.ps1 -Smoke -Parallel 4
        env:
          DOCKER_BUILDKIT: '1'

      - name: Full range-endpoint matrix (scheduled runs only)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          pwsh -NoProfile -File tools/host-tests/run-host-tests.ps1 -Parallel 4
        env:
          DOCKER_BUILDKIT: '1'

      - name: Upload harness report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: host-test-report
          path: |
            tools/host-tests/reports/latest.md
            tools/host-tests/reports/latest.html
            tools/host-tests/reports/latest.json

      - name: Open an issue on harness failure
        if: failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '## AuthCore host-compatibility failure\n\n';
            try { body += fs.readFileSync('tools/host-tests/reports/latest.md', 'utf8').slice(0, 6000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'Host-compat matrix failure (' + new Date().toISOString().slice(0,10) + ')',
              body: body
            });

  release:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17 + JDK 21 + JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25

      - name: Set up PowerShell 7
        uses: actions/setup-powershell@v2

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build all variants
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :1.18.2-fabric:build :1.18.2-forge:build \
            :1.21.11-fabric:build :1.21.11-forge:build :1.21.11-neoforge:build \
            :26.2-fabric:build :26.2-neoforge:build

      - name: Stage jars + changelog
        run: |
          mkdir -p release
          cp versions/*/build/libs/authcore-*.jar release/
          rm -f release/*sources*.jar
          VER="${GITHUB_REF_NAME#v}"
          awk -v ver="$VER" '
            /^## / {
              if (index($0, "[" ver "]") > 0) { in_section = 1; next }
              else if (in_section) exit
              next
            }
            in_section { print }
          ' changelogs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release of AuthCore $VER - see changelogs/changelog.md for details." > release-notes.md
          fi
          ls -la release/

      - name: Host-compat validation (smoke) before publishing
        run: |
          mkdir -p dist
          cp release/*.jar dist/
          pwsh -NoProfile -File tools/host-tests/run-host-tests.ps1 -Smoke -Parallel 4
        env:
          DOCKER_BUILDKIT: '1'

      - name: Replace the GitHub Release for this version (clean)
        # Same tag = same version: delete the existing release (and its assets),
        # then recreate it with the validated jars + changelog. Old files never linger.
        run: |
          TAG="${{ github.ref_name }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Existing release $TAG found - replacing it entirely."
            gh release delete "$TAG" --yes
          fi
          gh release create "$TAG" \
            release/*.jar \
            --title "AuthCore $TAG" \
            --notes-file release-notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
