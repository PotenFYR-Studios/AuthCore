name: CI

# ONE workflow, FIVE jobs - cross-connected so nothing builds twice:
#   build             - builds the SIX variants (3 ranges x fabric/forge/neoforge) IN PARALLEL
#                       via a matrix (one runner per variant), verifies each jar's role, runs
#                       the security test suite once on the primary variant, uploads per-variant
#                       jar artifacts
#   merge             - needs build: collects all six jars, enforces the exact-count gate +
#                       full role verification, publishes the shared "authcore-jars" artifact
#   host-tests        - needs merge: downloads the jars (no rebuild) and runs the Docker
#                       harness (smoke on push/PR, full range matrix on workflow_dispatch)
#   release           - needs merge + host-tests, v* tags only: publishes/updates the stable
#                       GitHub Release for the tag (jars + changelog section). Re-releasing
#                       the same version replaces the jars and re-publishes the notes in
#                       place - same tag = same release, never a second entry.
#   version-tag-guard - master pushes only: fails the run when gradle.properties'
#                       mod.version was bumped but no matching v* tag exists on the remote,
#                       because the release job is tag-gated and would silently publish
#                       nothing. Red here means: "git tag v<version> && git push origin
#                       v<version>" was forgotten - the release does not exist until the
#                       tag is pushed.
#
# Release policy: stable v* tag releases ONLY. Master pushes build and test but
# never publish - there is no dev/latest build and never will be.
#
# Speed notes: the matrix cuts wall-clock build time roughly by the variant count
# (each leg compiles one Stonecutter variant); Gradle deps + build cache are persisted
# between runs (setup-java cache + org.gradle.caching), so re-pushing a tag or
# rebuilding after a small change reuses most of the work. Note: a rare "Set up job"
# failure is GitHub runner infrastructure, NOT this repo - simply re-run the failed job.

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Never cancel a tagged build mid-release; branch builds are safe to supersede.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Least privilege by default; jobs that need write access declare it explicitly.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Group G1: 1.16 - 1.18 (Java 17)
          - variant: 1.18.2-fabric
            group: 1.16-1.18
            java: 17
          - variant: 1.18.2-forge
            group: 1.16-1.18
            java: 17
          # Group G2: 1.19 - 1.21 (Java 21)
          - variant: 1.21.11-fabric
            group: 1.19-1.21
            java: 21
          - variant: 1.21.11-neoforge
            group: 1.19-1.21
            java: 21
          # Group G3: 26.1 - 26.3 (Java 25)
          - variant: 26.3-fabric
            group: 26.1-26.3
            java: 25
          - variant: 26.3-neoforge
            group: 26.1-26.3
            java: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17 + JDK 21 + JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build variant ${{ matrix.variant }}
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :${{ matrix.variant }}:build --no-daemon --stacktrace

      - name: Stage jar
        run: |
          mkdir -p release
          cp versions/${{ matrix.variant }}/build/libs/authcore-*.jar release/
          rm -f release/*sources*.jar
          ls -la release/

      - name: Verify jar role (${{ matrix.variant }})
        run: |
          STATUS=0
          for JAR in release/authcore-*.jar; do
            echo "== $JAR =="
            CHECKS=(
              'in/potenfyr/authcore/AuthCoreServer.class|server entrypoint'
              'bungee.yml|bungee manifest'
              'velocity-plugin.json|velocity manifest'
            )
            for ENTRY in "${CHECKS[@]}"; do
              PATTERN="${ENTRY%%|*}"; LABEL="${ENTRY##*|}"
              if unzip -l "$JAR" | grep -q "$PATTERN"; then
                echo "  OK $LABEL"
              else
                echo "::error::$JAR missing $LABEL"
                STATUS=1
              fi
            done
            if unzip -l "$JAR" | grep -q 'fabric.mod.json'; then
              # Whitespace-tolerant: newer Stonecraft emits minified JSON
              # ("environment":"server") while older releases wrote a space after the colon.
              unzip -p "$JAR" fabric.mod.json | grep -Eq '"environment"[[:space:]]*:[[:space:]]*"server"' \
                && echo "  OK fabric env server" || { echo "::error::$JAR wrong fabric environment"; STATUS=1; }
            fi
            for TOML in META-INF/neoforge.mods.toml META-INF/mods.toml; do
              if unzip -l "$JAR" | grep -q "$TOML"; then
                unzip -p "$JAR" "$TOML" | grep -Eq 'modId[[:space:]]*=[[:space:]]*"authcore"' \
                  && echo "  OK $TOML metadata" || { echo "::error::$JAR bad $TOML"; STATUS=1; }
              fi
            done
          done
          exit $STATUS

      # The standalone security suite compiles against the REAL compiled classes, which
      # only exist inside a build leg - run it once on the primary (vcsVersion) variant.
      # The Gradle export task provides the EXACT variant classpath (a CI leg's global
      # cache has no standalone copies of transitive libs like slf4j-api/commons-lang3),
      # and PATH is pinned to JDK 21+ so javac can read Java-21 classfiles regardless of
      # which setup-java version ended up default.
      - name: Export security-test classpath (primary variant only)
        if: matrix.variant == '1.21.11-fabric'
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :${{ matrix.variant }}:exportSecurityTestLibs --no-daemon -q

      - name: Run security & business-logic tests
        if: matrix.variant == '1.21.11-fabric'
        run: |
          export PATH="${JAVA_HOME_21_X64:-$JAVA_HOME_25_X64}/bin:$PATH"
          bash test/run-security-tests.sh 1.21.11-fabric

      - name: Upload variant jars
        uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.variant }}
          path: release/*.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ matrix.variant }}
          path: |
            versions/${{ matrix.variant }}/build/reports/
            versions/${{ matrix.variant }}/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Collect all seven variant jars into one verified artifact that the
  # host-test harness, the stable release and the dev release consume.
  # ------------------------------------------------------------------
  merge:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
    steps:
      - name: Collect variant jars
        uses: actions/download-artifact@v8
        with:
          pattern: jars-*
          merge-multiple: true
          path: release

      - name: Verify jar count (6 variants expected)
        run: |
          COUNT=$(ls release/authcore-*.jar | wc -l)
          echo "Found $COUNT jars"
          if [ "$COUNT" -ne 6 ]; then
            echo "::error::Expected exactly 6 release jars, found $COUNT"
            exit 1
          fi
          ls -la release/

      - name: Upload merged jars (shared with host-tests and the stable release)
        uses: actions/upload-artifact@v7
        with:
          name: authcore-jars
          path: release/*.jar
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Docker compatibility harness: real servers, real boots, booted in
  # PARALLEL across group runners (G1: 1.16-1.18, G2: 1.19-1.21, G3: 26.1-26.3)
  # on the official eclipse-temurin JRE images (17/21/25).
  # Downloads the jars from `build` (never rebuilds).
  # ------------------------------------------------------------------
  host-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1.16-1.18
            java: 17
          - group: 1.19-1.21
            java: 21
          - group: 26.1-26.3
            java: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          name: authcore-jars
          path: dist

      # Speed: persist the harness downloads between runs (Fabric server
      # launchers, Fabric API, Forge/NeoForge installers). Only .cache is
      # cached - never work/: containers run as root on Linux CI, and
      # root-owned files cannot be pruned by the runner user.
      - name: Restore harness caches (server downloads)
        uses: actions/cache@v6
        with:
          path: test/docker/.cache
          key: dockertests-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('test/docker/**', 'versions/dependencies/*.properties') }}
          restore-keys: |
            dockertests-${{ runner.os }}-${{ matrix.group }}-
            dockertests-${{ runner.os }}-

      - name: Host-compatibility smoke for group ${{ matrix.group }} (push/PR only)
        if: github.event_name != 'workflow_dispatch'
        env:
          AUTHCORE_TEST_CACHE_DIR: ${{ github.workspace }}/test/docker/.cache
        run: |
          bash test/docker/run-tests.sh --groups ${{ matrix.group }} --java ${{ matrix.java }} --smoke

      - name: Full range-endpoint matrix for group ${{ matrix.group }} (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          AUTHCORE_TEST_CACHE_DIR: ${{ github.workspace }}/test/docker/.cache
        run: |
          bash test/docker/run-tests.sh --groups ${{ matrix.group }} --java ${{ matrix.java }} --all

      - name: Upload harness report for group ${{ matrix.group }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-test-report-${{ matrix.group }}
          path: |
            test/docker/report/

  # ------------------------------------------------------------------
  # Stable release: waits for merge + host-tests (verified on real servers),
  # then publishes/updates the release for the tag (jars + changelog section).
  # Releases are only created after the full test suite passes.
  # ------------------------------------------------------------------
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [merge, host-tests]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download validated jars
        uses: actions/download-artifact@v8
        with:
          name: authcore-jars
          path: release

      - name: Extract changelog section for this version
        run: |
          VER="${GITHUB_REF_NAME#v}"
          # Match the EXACT version bracket: "[1.0.0]" must not match
          # "[1.0.0-alpha.5]" (substring bug). Compare the heading's bracket
          # field literally, so only sections for the tagged version are used.
          awk -v ver="$VER" '
            /^## / {
              field = $2
              if (field == "[" ver "]") { in_section = 1; next }
              else if (in_section) exit
              next
            }
            in_section { print }
          ' changelogs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Release of AuthCore $VER - see changelogs/changelog.md for details." > release-notes.md
          fi
          ls -la release/

      - name: Publish or update the GitHub Release for this version
        # Existing release for the same tag = same version: replace the notes and
        # re-upload the jars with --clobber (old assets are overwritten, nothing
        # lingers). A different tag creates a brand new release. Never deletes
        # first, so a failed publish cannot leave the release missing.
        run: |
          : "${TAG:?TAG is required}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - updating notes and replacing assets."
            # `gh release upload --clobber` only replaces same-named files, so an asset
            # that is no longer part of the build (e.g. after a range rename like
            # 26.1-26.2 -> 26.1-26.3) would linger forever. Prune anything not in release/.
            for ASSET in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              if [ ! -f "release/$ASSET" ]; then
                echo "  pruning stale asset: $ASSET"
                gh release delete-asset "$TAG" "$ASSET" --yes
              fi
            done
            gh release upload "$TAG" release/*.jar --clobber
            gh release edit "$TAG" --notes-file release-notes.md --latest=true
          else
            echo "Release $TAG does not exist - creating it."
            gh release create "$TAG" \
              release/*.jar \
              --title "AuthCore $TAG" \
              --notes-file release-notes.md \
              --latest=true
          fi
        env:
          TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}

  # ------------------------------------------------------------------
  # Release-consistency guard: the stable release job only fires on v* tags,
  # so a version bump that lands on master without its tag publishes nothing
  # and looks green. This job fails the run in exactly that case.
  # ------------------------------------------------------------------
  version-tag-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Verify a version bump carries its v* tag
        run: |
          VER=$(grep -E '^mod\.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VER" ]; then
            echo "::error::Could not read mod.version from gradle.properties"
            exit 1
          fi
          PREV_VER=$(git show HEAD~1:gradle.properties 2>/dev/null \
            | grep -E '^mod\.version=' | cut -d= -f2 | tr -d '[:space:]')
          if [ "$VER" = "$PREV_VER" ]; then
            echo "Version unchanged ($VER) - nothing to check."
            exit 0
          fi
          echo "Version bumped on master: ${PREV_VER:-<none>} -> $VER"
          if git ls-remote --exit-code origin "refs/tags/v$VER" >/dev/null 2>&1; then
            echo "Tag v$VER exists on the remote - the release job will publish it."
          else
            echo "::error::Version bumped to $VER but tag v$VER is missing - no stable release will be published. Fix: git tag v$VER && git push origin v$VER, then re-run this job."
            exit 1
          fi


