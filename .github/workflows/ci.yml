name: CI

# ONE workflow, SIX jobs - cross-connected so nothing builds twice:
#   guard       - metadata guard: mod.version <-> changelog section <-> runtime constant,
#                 templated descriptors, and every versions/* node present in the matrix
#   lint        - actionlint over .github/workflows (catches broken expressions, unknown
#                 inputs and stale action versions without spending a build leg)
#   build       - builds the EIGHT variants (4 ranges x fabric/forge/neoforge) IN PARALLEL via a
#                 matrix (one runner per variant), verifies each jar's role/descriptors and
#                 bytecode target, runs the security test suite once on the primary variant,
#                 uploads per-variant jar artifacts
#   merge       - needs build: collects all eight jars, enforces the exact-count gate, publishes
#                 the shared "authcore-jars" artifact
#   host-tests  - needs merge: downloads the jars (no rebuild) and runs the Docker harness
#                 (smoke on push/PR, full range matrix on workflow_dispatch)
#   release     - needs merge + host-tests, master pushes (and manual runs on master) only:
#                 publishes the release for the version in gradle.properties, with SHA256SUMS
#                 and a build-provenance attestation.
#
# Release policy - ONE release per version, driven by gradle.properties (mod.version):
#   - The version has no release yet  -> the release "AuthCore v<version>" is created and the
#                                        v<version> tag is created on the built commit.
#   - The version already has a release -> the SAME release is updated in place: the jars are
#                                        replaced with the new build (stale assets pruned), the
#                                        notes are replaced with the current changelog section,
#                                        and the v<version> tag is moved to the built commit.
#                                        No second release, no new tag, no draft.
#   - Bumping mod.version is the ONLY way to get a new release entry.
# Nothing is published unless every build leg AND every host-test group passed, so a red run
# never touches the existing release. Pull requests build and test but never publish, and
# there are no dev/nightly releases. Tags are managed by this workflow - never push v* tags
# by hand (a manual tag push does not trigger anything).
#
# Speed notes: the matrix cuts wall-clock build time roughly by the variant count
# (each leg compiles one Stonecutter variant); Gradle deps + build cache are persisted
# between runs (setup-java cache + org.gradle.caching). A rare "Set up job" failure is GitHub
# runner infrastructure, NOT this repo - simply re-run the failed job.
#
# Runner image: pinned to ubuntu-24.04 (not ubuntu-latest, which GitHub migrates to Ubuntu 26
# from 2026-10-19) so a runner-image change can never turn the Docker harness red on its own.

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Master runs QUEUE instead of cancelling each other: a cancelled run could stop the release
  # job half-way through replacing the assets. Superseded pull-request runs are safe to cancel.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Least privilege by default; jobs that need write access declare it explicitly.
permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  # ------------------------------------------------------------------
  # Fast metadata checks: run in parallel with the build and fail the run
  # in seconds when version/changelog/matrix metadata has drifted, instead
  # of at the release step an hour later.
  # ------------------------------------------------------------------
  guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Version, changelog and matrix guard
        run: bash .github/scripts/version-guard.sh

  # ------------------------------------------------------------------
  # Lint the workflow itself. actionlint catches broken expressions,
  # unknown action inputs and invalid YAML - shellcheck is disabled on
  # purpose so the run stays about the pipeline, not the test scripts.
  # ------------------------------------------------------------------
  lint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: actionlint
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -shellcheck=

  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          # Group G1: 1.16 - 1.18 (Java 17, classfile major 61)
          - variant: 1.18.2-fabric
            group: 1.16-1.18
            java: 17
            classfile: 61
          - variant: 1.18.2-forge
            group: 1.16-1.18
            java: 17
            classfile: 61
          # Group G2a: 1.19 - 1.20.1 (Java 17, classfile major 61) - Fabric + legacy Forge
          - variant: 1.20.1-fabric
            group: 1.19-1.20
            java: 17
            classfile: 61
          - variant: 1.20.1-forge
            group: 1.19-1.20
            java: 17
            classfile: 61
          # Group G2b: 1.20.2 - 1.21 (Java 21, classfile major 65)
          - variant: 1.21.11-fabric
            group: 1.20.2-1.21
            java: 21
            classfile: 65
          - variant: 1.21.11-neoforge
            group: 1.20.2-1.21
            java: 21
            classfile: 65
          # Group G3: 26.1 - 26.3 (Java 25, classfile major 69)
          - variant: 26.3-fabric
            group: 26.1-26.3
            java: 25
            classfile: 69
          - variant: 26.3-neoforge
            group: 26.1-26.3
            java: 25
            classfile: 69
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 17 + JDK 21 + JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: |
            17
            21
            25
          cache: 'gradle'

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Resolve version
        id: version
        run: |
          VER=$(grep -E '^mod\.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VER" ]; then
            echo "::error::Could not read mod.version from gradle.properties"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Building $VER for ${{ matrix.variant }}"

      - name: Build variant ${{ matrix.variant }}
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :${{ matrix.variant }}:build --no-daemon --stacktrace

      - name: Stage jar
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p release
          cp versions/${{ matrix.variant }}/build/libs/authcore-*.jar release/
          rm -f release/*sources*.jar
          ls -la release/
          # The artifact name carries the version - a mismatch means the jar came from stale
          # metadata (the release job would refuse it an hour later).
          if ! ls release/authcore-*-"$VER".jar >/dev/null 2>&1; then
            echo "::error::No authcore-*-$VER.jar was produced"
            exit 1
          fi

      - name: Verify jar role (${{ matrix.variant }})
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          STATUS=0
          for JAR in release/authcore-*.jar; do
            echo "== $JAR =="
            CHECKS=(
              'in/potenfyr/authcore/AuthCoreServer.class|server entrypoint'
              'bungee.yml|bungee manifest'
              'velocity-plugin.json|velocity manifest'
            )
            for ENTRY in "${CHECKS[@]}"; do
              PATTERN="${ENTRY%%|*}"; LABEL="${ENTRY##*|}"
              if unzip -l "$JAR" | grep -q "$PATTERN"; then
                echo "  OK $LABEL"
              else
                echo "::error::$JAR missing $LABEL"
                STATUS=1
              fi
            done
            if unzip -l "$JAR" | grep -q 'fabric.mod.json'; then
              # Whitespace-tolerant: newer Stonecraft emits minified JSON
              # ("environment":"server") while older releases wrote a space after the colon.
              unzip -p "$JAR" fabric.mod.json | grep -Eq '"environment"[[:space:]]*:[[:space:]]*"server"' \
                && echo "  OK fabric env server" || { echo "::error::$JAR wrong fabric environment"; STATUS=1; }
              # Loom only loads a mixin config a mod declares - the 1.0.2 fabric jars declared it,
              # a regression here silently disables every mixin.
              unzip -p "$JAR" fabric.mod.json | grep -q 'authcore.server.mixins.json' \
                && echo "  OK fabric mixin config declared" || { echo "::error::$JAR: fabric.mod.json does not declare the mixin config"; STATUS=1; }
            fi
            for TOML in META-INF/neoforge.mods.toml META-INF/mods.toml; do
              if unzip -l "$JAR" | grep -q "$TOML"; then
                unzip -p "$JAR" "$TOML" | grep -Eq 'modId[[:space:]]*=[[:space:]]*"authcore"' \
                  && echo "  OK $TOML metadata" || { echo "::error::$JAR bad $TOML"; STATUS=1; }
                unzip -p "$JAR" "$TOML" | grep -q 'authcore.server.mixins.json' \
                  && echo "  OK $TOML mixin config declared" || { echo "::error::$JAR: $TOML does not declare the mixin config"; STATUS=1; }
              fi
            done
            # Legacy Forge (1.16-1.18) ignores the [[mixins]] toml block entirely and only reads
            # the jar manifest - the 1.0.2 forge jar shipped with zero active mixins because of it.
            case "${{ matrix.variant }}" in
              1.18.2-forge|1.20.1-forge)
                unzip -p "$JAR" META-INF/MANIFEST.MF | grep -q 'MixinConfigs: authcore.server.mixins.json' \
                  && echo "  OK legacy Forge MixinConfigs manifest" \
                  || { echo "::error::$JAR: legacy Forge manifest has no MixinConfigs - no mixin would load"; STATUS=1; }
                ;;
            esac
            # Proxy descriptors are templated from mod.version - a stale copy mislabels the
            # proxy plugin (and the velocity-plugin.json is what Velocity reads at boot).
            unzip -p "$JAR" bungee.yml | grep -Eq "^version:[[:space:]]*\"?$VER\"?[[:space:]]*$" \
              && echo "  OK bungee.yml version $VER" || { echo "::error::$JAR: bungee.yml does not carry version $VER"; STATUS=1; }
            unzip -p "$JAR" velocity-plugin.json | grep -Eq "\"version\"[[:space:]]*:[[:space:]]*\"$VER\"" \
              && echo "  OK velocity-plugin.json version $VER" || { echo "::error::$JAR: velocity-plugin.json does not carry version $VER"; STATUS=1; }
          done
          exit $STATUS

      # Servers in range reject a jar compiled for a newer JVM with UnsupportedClassVersionError.
      # The matrix records the expected classfile major per version group (17 -> 61, 21 -> 65,
      # 25 -> 69) so a toolchain change cannot silently ship 26.3 bytecode to a 1.16 server.
      - name: Verify bytecode target (classfile ${{ matrix.classfile }})
        run: |
          for JAR in release/authcore-*.jar; do
            MAJOR=$(unzip -p "$JAR" in/potenfyr/authcore/AuthCoreServer.class | od -An -j 6 -N 2 -t u1 |
              awk '{print $1 * 256 + $2}')
            echo "$JAR -> classfile major $MAJOR (expected ${{ matrix.classfile }})"
            if [ "$MAJOR" != "${{ matrix.classfile }}" ]; then
              echo "::error::$JAR targets classfile major $MAJOR, expected ${{ matrix.classfile }} (Java ${{ matrix.java }})"
              exit 1
            fi
          done

      - name: Job summary
        if: always()
        run: |
          {
            echo "### Build leg: ${{ matrix.variant }}"
            echo
            echo "| jar | size |"
            echo "|---|---|"
            for JAR in release/*.jar; do
              [ -f "$JAR" ] || continue
              echo "| $(basename "$JAR") | $(du -h "$JAR" | cut -f1) |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      # The standalone security suite compiles against the REAL compiled classes, which
      # only exist inside a build leg - run it once on the primary (vcsVersion) variant.
      # The Gradle export task provides the EXACT variant classpath (a CI leg's global
      # cache has no standalone copies of transitive libs like slf4j-api/commons-lang3),
      # and PATH is pinned to JDK 21+ so javac can read Java-21 classfiles regardless of
      # which setup-java version ended up default.
      - name: Export security-test classpath (primary variant only)
        if: matrix.variant == '1.21.11-fabric'
        run: |
          JAVA_HOME="${JAVA_HOME_25_X64}" ./gradlew \
            :${{ matrix.variant }}:exportSecurityTestLibs --no-daemon -q

      - name: Run security & business-logic tests
        if: matrix.variant == '1.21.11-fabric'
        run: |
          export PATH="${JAVA_HOME_21_X64:-$JAVA_HOME_25_X64}/bin:$PATH"
          bash test/run-security-tests.sh 1.21.11-fabric

      - name: Upload variant jars
        uses: actions/upload-artifact@v7
        with:
          name: jars-${{ matrix.variant }}
          path: release/*.jar
          retention-days: 7
          if-no-files-found: error

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-reports-${{ matrix.variant }}
          path: |
            versions/${{ matrix.variant }}/build/reports/
            versions/${{ matrix.variant }}/build/test-results/
          retention-days: 7
          if-no-files-found: ignore

  # ------------------------------------------------------------------
  # Collect all eight variant jars into one verified artifact that the
  # host-test harness and the release consume.
  # ------------------------------------------------------------------
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: build
    permissions:
      contents: read
    steps:
      - name: Collect variant jars
        uses: actions/download-artifact@v8
        with:
          pattern: jars-*
          merge-multiple: true
          path: release

      - name: Verify jar count (8 variants expected)
        run: |
          COUNT=$(ls release/authcore-*.jar | wc -l)
          echo "Found $COUNT jars"
          if [ "$COUNT" -ne 8 ]; then
            echo "::error::Expected exactly 6 release jars, found $COUNT"
            exit 1
          fi
          ls -la release/

      - name: Upload merged jars (shared with host-tests and the stable release)
        uses: actions/upload-artifact@v7
        with:
          name: authcore-jars
          path: release/*.jar
          retention-days: 7
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Docker compatibility harness: real servers, real boots, booted in
  # PARALLEL across group runners (G1: 1.16-1.18, G2a: 1.19-1.20, G2b: 1.20.2-1.21, G3: 26.1-26.3)
  # on the official eclipse-temurin JRE images (17/21/25).
  # Downloads the jars from `build` (never rebuilds).
  # ------------------------------------------------------------------
  host-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    needs: merge
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: 1.16-1.18
            java: 17
          - group: 1.19-1.20
            java: 17
          - group: 1.20.2-1.21
            java: 21
          - group: 26.1-26.3
            java: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download jars
        uses: actions/download-artifact@v8
        with:
          name: authcore-jars
          path: dist

      # Speed: persist the harness downloads between runs (Fabric server
      # launchers, Fabric API, Forge/NeoForge installers). Only .cache is
      # cached - never work/: containers run as root on Linux CI, and
      # root-owned files cannot be pruned by the runner user.
      - name: Restore harness caches (server downloads)
        uses: actions/cache@v6
        with:
          path: test/docker/.cache
          key: dockertests-${{ runner.os }}-${{ matrix.group }}-${{ hashFiles('test/docker/**', 'versions/dependencies/*.properties') }}
          restore-keys: |
            dockertests-${{ runner.os }}-${{ matrix.group }}-
            dockertests-${{ runner.os }}-

      - name: Host-compatibility smoke for group ${{ matrix.group }} (push/PR only)
        if: github.event_name != 'workflow_dispatch'
        env:
          AUTHCORE_TEST_CACHE_DIR: ${{ github.workspace }}/test/docker/.cache
        run: |
          bash test/docker/run-tests.sh --groups ${{ matrix.group }} --java ${{ matrix.java }} --smoke

      - name: Full range-endpoint matrix for group ${{ matrix.group }} (manual runs only)
        if: github.event_name == 'workflow_dispatch'
        env:
          AUTHCORE_TEST_CACHE_DIR: ${{ github.workspace }}/test/docker/.cache
        run: |
          bash test/docker/run-tests.sh --groups ${{ matrix.group }} --java ${{ matrix.java }} --all

      # Make a red host-test diagnosable from the run page alone: the per-version result table
      # plus every failing in-server self-test line ("[FAIL] <check>: <detail>") go to the job
      # summary and the log (the artifact download needs repo access).
      - name: Summarise harness results for group ${{ matrix.group }}
        if: always()
        run: |
          REPORT=test/docker/report/latest.md
          if [ -f "$REPORT" ]; then
            cat "$REPORT" >> "$GITHUB_STEP_SUMMARY"
            cat "$REPORT"
          fi
          FAILS=$(grep -rahE "\[FAIL\]|AuthCore self-test:" test/docker 2>/dev/null \
            --include='*.log' --include='*.out' --include='*.txt' | sort -u | head -100 || true)
          if [ -n "$FAILS" ]; then
            {
              echo
              echo "### In-server self-test lines"
              echo '```'
              echo "$FAILS"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            echo "$FAILS"
          fi

      - name: Upload harness report for group ${{ matrix.group }}
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: host-test-report-${{ matrix.group }}
          path: |
            test/docker/report/

  # ------------------------------------------------------------------
  # Release: one release per mod.version, created once and then updated in place (jars
  # replaced, notes replaced, tag moved). Runs only after every build leg and every host-test
  # group passed.
  # ------------------------------------------------------------------
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [guard, lint, merge, host-tests]
    if: >-
      github.ref == 'refs/heads/master'
      && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    permissions:
      contents: write
      # Build-provenance attestation (signed by GitHub's OIDC identity) so a published jar
      # can be verified as built by this workflow, from this commit.
      id-token: write
      attestations: write
    concurrency:
      group: release-${{ github.repository }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Download validated jars
        uses: actions/download-artifact@v8
        with:
          name: authcore-jars
          path: release

      - name: Resolve version
        id: version
        run: |
          VER=$(grep -E '^mod\.version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$VER" ]; then
            echo "::error::Could not read mod.version from gradle.properties"
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "Releasing AuthCore $VER from ${GITHUB_SHA}"

      - name: Verify the jars belong to this version
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          COUNT=0
          for JAR in release/*.jar; do
            COUNT=$((COUNT+1))
            case "$(basename "$JAR")" in
              authcore-*-"$VER".jar) echo "  OK $(basename "$JAR")" ;;
              *) echo "::error::$(basename "$JAR") is not a $VER build"; exit 1 ;;
            esac
          done
          if [ "$COUNT" -ne 8 ]; then
            echo "::error::Expected 6 jars for $VER, found $COUNT"
            exit 1
          fi

      # Checksums travel with the jars so a downloader can verify what they got, and every jar
      # gets a build-provenance attestation (verify with `gh attestation verify <jar> -R repo`).
      - name: Generate checksums
        run: |
          cd release
          sha256sum authcore-*.jar | sort -k2 > SHA256SUMS
          cat SHA256SUMS

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: 'release/authcore-*.jar'

      - name: Extract changelog section for this version
        env:
          VER: ${{ steps.version.outputs.version }}
        run: |
          # Match the EXACT version bracket: "[1.0.0]" must not match "[1.0.0-alpha.5]".
          awk -v ver="$VER" '
            /^## / {
              field = $2
              if (field == "[" ver "]") { in_section = 1; next }
              else if (in_section) exit
              next
            }
            in_section { print }
          ' changelogs/changelog.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::warning::No '## [$VER]' section in changelogs/changelog.md - using a generic note"
            echo "Release of AuthCore $VER - see changelogs/changelog.md for details." > release-notes.md
          fi
          {
            echo
            echo "---"
            echo "Build: \`${GITHUB_SHA::7}\` ($(date -u '+%Y-%m-%d %H:%M UTC'))"
          } >> release-notes.md
          wc -l release-notes.md

      - name: Create or update the release for this version
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VER: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TITLE="AuthCore $TAG"

          # Point the version tag at the commit that was just built and tested. Moving it is
          # what makes the release (and its "Source code" archives) match the replaced jars.
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "Moving tag $TAG -> $GITHUB_SHA"
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/$TAG" \
              -f sha="$GITHUB_SHA" -F force=true >/dev/null
          else
            echo "Creating tag $TAG -> $GITHUB_SHA"
            gh api -X POST "repos/$GH_REPO/git/refs" \
              -f ref="refs/tags/$TAG" -f sha="$GITHUB_SHA" >/dev/null
          fi

          upload_with_retry() {
            for attempt in 1 2 3; do
              if gh release upload "$TAG" release/*.jar release/SHA256SUMS --clobber; then return 0; fi
              echo "upload attempt $attempt failed - retrying"
              sleep $((attempt * 10))
            done
            return 1
          }

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists - replacing jars and notes in place (no new release)."
            # Replace the jars first (same file names = same version), then prune anything that
            # is no longer part of the build, so the release is never left without its jars.
            upload_with_retry
            for ASSET in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              if [ ! -f "release/$ASSET" ]; then
                echo "  pruning stale asset: $ASSET"
                gh release delete-asset "$TAG" "$ASSET" --yes
              fi
            done
            gh release edit "$TAG" \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --draft=false \
              --prerelease=false \
              --latest
          else
            echo "Release $TAG does not exist - creating it."
            gh release create "$TAG" release/*.jar release/SHA256SUMS \
              --verify-tag \
              --title "$TITLE" \
              --notes-file release-notes.md \
              --latest
          fi

      - name: Verify the published release
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view "$TAG" --json name,tagName,isDraft,assets \
            --jq '"\(.name) (\(.tagName)) draft=\(.isDraft)", (.assets[] | "  \(.name)  \(.size) bytes  \(.updatedAt)")'
          PUBLISHED=$(gh release view "$TAG" --json assets --jq '.assets | length')
          if [ "$PUBLISHED" -ne 7 ]; then
            echo "::error::Release $TAG has $PUBLISHED assets, expected 7 (6 jars + SHA256SUMS)"
            exit 1
          fi
          for JAR in release/*.jar; do
            NAME=$(basename "$JAR")
            LOCAL=$(stat -c %s "$JAR")
            REMOTE=$(gh release view "$TAG" --json assets --jq ".assets[] | select(.name==\"$NAME\") | .size")
            if [ "$LOCAL" != "$REMOTE" ]; then
              echo "::error::$NAME on the release ($REMOTE bytes) does not match this build ($LOCAL bytes)"
              exit 1
            fi
          done
          # Re-download the published checksum file and verify the published jars against it -
          # proving the assets on the release are byte-for-byte this build.
          VERIFY_DIR=$(mktemp -d)
          gh release download "$TAG" --pattern 'authcore-*.jar' --pattern 'SHA256SUMS' --dir "$VERIFY_DIR"
          ( cd "$VERIFY_DIR" && sha256sum -c SHA256SUMS )
          rm -rf "$VERIFY_DIR"
          echo "Release $TAG carries exactly this build's 6 jars (checksums verified)."
