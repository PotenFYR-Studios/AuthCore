# ============================================================================
# AuthCore Gradle properties.
# ============================================================================
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# ---- mod metadata (used by Stonecraft for pack metadata + publishing) --------
mod.id=authcore
mod.name=AuthCore
mod.version=1.0.1
mod.group=net.ded3ec
mod.description=Universal authentication framework for Minecraft servers - multi-loader (Fabric/Forge/NeoForge), multi-version (1.16.x - 26.1-26.2). One jar for servers, clients and BungeeCord/Velocity proxies.

# ---- third-party libraries (shaded into the jar) ------------------------------
sqlite_version=3.51.1.0
mysql_version=9.5.0
postgres_version=42.7.5
jedis_version=5.2.0
commons_pool2_version=2.12.0
gson_version=2.13.2
kotlin_version=2.2.20
configurate_core_version=4.2.0
configurate_hocon_version=4.2.0
password4j_version=1.8.4
bouncycastle_version=1.78.1
option_version=1.1.0
geantyref_version=1.3.13
two_factor_auth_version=1.3

# ---- compile-only APIs (never shaded) -----------------------------------------
floodgate_version=+
luckperms_version=5.4
bungeecord_api_version=1.21-R0.3
velocity_api_version=3.1.1
