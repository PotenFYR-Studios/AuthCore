# ============================================================================
# AuthCore Gradle properties.
# ============================================================================
org.gradle.jvmargs=-Xmx4G
org.gradle.parallel=true
org.gradle.caching=true

# ---- mod metadata (used by Stonecraft for pack metadata + publishing) --------
mod.id=authcore
mod.name=AuthCore
mod.version=1.0.0
mod.group=in.potenfyr.authcore
mod.description=Universal authentication framework for Minecraft servers - multi-loader (Fabric/Forge/NeoForge), multi-version (1.16.x - 26.1-26.3). One jar for servers and BungeeCord/Velocity proxies.

# ---- third-party libraries (shaded into the jar) ------------------------------
sqlite_version=3.53.4.0
mysql_version=9.7.0
postgres_version=42.7.13
jedis_version=5.2.0
commons_pool2_version=2.13.1
gson_version=2.14.0
kotlin_version=2.4.20
configurate_core_version=4.2.0
configurate_hocon_version=4.2.0
password4j_version=1.8.4
bouncycastle_version=1.86
option_version=1.1.0
geantyref_version=1.3.16
two_factor_auth_version=1.3

# ---- compile-only APIs (never shaded) -----------------------------------------
floodgate_version=2.2.7
luckperms_version=5.5
bungeecord_api_version=1.21-R0.3
velocity_api_version=3.4.0
org.gradle.java.installations.auto-download=true
