        text="Informationen über '%1$s':\nUUID: %2$s\nPlattform: %3$s\nModus: %4$s\nIP-Adresse: %5$s\nStatus: %6$s\nOffline registriert: %7$s\nLand: %8$s\nErstellt am: %9$s\nAuthentifiziert: %10$s"
