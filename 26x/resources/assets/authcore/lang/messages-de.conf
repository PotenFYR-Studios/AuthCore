# bundled English defaults.

prompt-admin-change-user-mode {
    action-bar {
        text="Der Modus des Benutzers %1$s wurde erfolgreich auf %2$s gesetzt!"
    }
}

prompt-admin-list-of-players {
    message {
        text="Liste der '%1$s' in AuthCore: %2$s"
    }
}

prompt-admin-reloaded-configuration {
    action-bar {
        text="Die Konfigurationsdateien von AuthCoreServer wurden erfolgreich neu geladen!"
    }
}

prompt-admin-spawn-location-updated {
    action-bar {
        text="Neue Spawn-Position für Limbo konfiguriert: Welt: %1$s | X-Koordinate: %2$s | Y-Koordinate: %3$s | Z-Koordinate: %4$s"
    }
}

prompt-admin-user-data-deleted {
    logout {
        text="Das Konto des Benutzers '%1$s' wurde aus der Datenbank und vom Server gelöscht!"
    }
}

prompt-admin-user-is-not-active {
    action-bar {
        text="Der Benutzer ist nicht aktiv auf dem Server!"
    }
}

prompt-admin-user-not-found {
    logout {
        text="Die Daten des Benutzers %1$s konnten nicht gefunden werden. Bitte sag ihm, dass er sich auf dem Server registrieren soll."
    }
}

prompt-admin-user-password-changed-successfully {
    action-bar {
        text="Das Passwort des Benutzers %1$s wurde erfolgreich geändert!"
    }
}

