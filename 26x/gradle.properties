# 26.x build: Minecraft 26.2 ships UNOBFUSCATED code (Mojang names at runtime, no intermediary).
# This project builds the AuthCore source (migrated to Mojang names in src/mojang26x) against
# 26.2. It is a SEPARATE jar from the classic universal jar (yarn/intermediary, 1.16-1.21.11) -
# the two name-spaces cannot coexist in one compiled jar (see docs/26x.md).

org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true
org.gradle.configuration-cache=false

minecraft_version=26.2
loader_version=0.19.3
loom_version=1.16.2
fabric_api_version=0.156.0+26.2

mod_version=1.0.0
maven_group=net.ded3ec
archives_base_name=authcore

sqlite_version=3.51.1.0
mysql_version=9.5.0
postgres_version=42.7.5
jedis_version=5.2.0
commons_pool2_version=2.12.0
gson_version=2.13.2
kotlin_version=2.2.20
configurate_core_version=4.2.0
configurate_hocon_version=4.2.0
password4j_version=1.8.4
floodgate_version=+
bouncycastle_version=1.78.1

fabric.loom.disableObfuscation=true
