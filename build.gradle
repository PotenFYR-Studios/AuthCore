plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

base {
    archivesName = project.archives_base_name
}


repositories {
    // Add repositories to retrieve artifacts from in here.
    // You should only use this when depending on other mods because
    // Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
    // See https://docs.gradle.org/current/userguide/declaring_repositories.html
    // for more information about repositories.

    mavenCentral()
    maven {
        url = uri("https://repo.opencollab.dev/main/")
    }
}

dependencies {
    // To change the versions see the gradle.properties file
    minecraft "com.mojang:minecraft:${project.minecraft_version}"

    // Mappings: yarn by default. For Minecraft versions without yarn (e.g. 26.x) set
    // mappings_type=mojmap (or leave yarn_mappings blank) to use official Mojang mappings.
    // The jar is remapped to stable intermediary names at build time, so it loads on every
    // version whose intermediary names are compatible - 1.16.x through 26.x are supported.
    if (project.findProperty('mappings_type') == 'mojmap' || project.yarn_mappings.isBlank()) {
        mappings loom.officialMojangMappings()
    } else {
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    }

    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Fabric API. This is technically optional, but you probably want it anyway.
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-entity-events-v1:${project.fabric_api_version}"

    // MySQL Driver
    implementation(include("com.mysql:mysql-connector-j:${mysql_version}"))

    // SQLite Driver
    implementation(include("org.xerial:sqlite-jdbc:${sqlite_version}"))

    // PostgreSQL Driver (optional - enable in config)
    implementation(include("org.postgresql:postgresql:${postgres_version}"))

    // Redis client for network-wide session/ban sync (optional - enable in config)
    implementation(include("redis.clients:jedis:${jedis_version}"))
    implementation(include("org.apache.commons:commons-pool2:${commons_pool2_version}"))

    // BouncyCastle: self-signed certificate generation for the HTTPS web panel
    implementation(include("org.bouncycastle:bcpkix-jdk18on:${bouncycastle_version}"))
    implementation(include("org.bouncycastle:bcprov-jdk18on:${bouncycastle_version}"))

    // Gson for JSON (JDK HttpClient is used for HTTP - no external HTTP library needed)
    implementation(include("com.google.code.gson:gson:${project.gson_version}"))

    // Configurate core + dependencies (HOCON config files)
    implementation(include("net.kyori:option:1.1.0"))
    implementation(include("io.leangen.geantyref:geantyref:1.3.13"))
    implementation(include("org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"))
    implementation(include("org.spongepowered:configurate-core:${project.configurate_core_version}"))
    implementation(include("org.spongepowered:configurate-hocon:${project.configurate_hocon_version}"))

    // Password4j for password hashing (argon2/bcrypt/scrypt/pbkdf2)
    implementation(include("com.password4j:password4j:${project.password4j_version}"))

    // Floodgate API by GeyserMC (compileOnly, not shaded)
    compileOnly("org.geysermc.floodgate:api:${project.floodgate_version}")

    // LuckPerms API (compileOnly, not shaded)
    compileOnly("net.luckperms:api:5.4")

    // 2FA Library (TOTP - RFC 6238)
    implementation(include("com.j256.two-factor-auth:two-factor-auth:1.3"))
}

// ------------------------------------------------------------------
// Optional client login-screen companion (1.19.4+ client support):
//   default = server-only universal jar
//   `gradlew build -Pclient_build=true` adds the client entrypoint, client mixins and
//   the client classes to the same jar (client-side login screen + auto-login).
// ------------------------------------------------------------------
sourceSets {
    if (project.findProperty('client_build') == 'true') {
        main {
            java {
                srcDir 'src/client/java'
            }
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "mixin_compatibility_level", project.mixin_compatibility_level

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    filesMatching("authcore.server.mixins.json") {
        expand "mixin_compatibility_level": inputs.properties.mixin_compatibility_level
    }

    filesMatching("authcore.client.mixins.json") {
        expand "mixin_compatibility_level": inputs.properties.mixin_compatibility_level
    }
}

// Patches the processed fabric.mod.json in place so the universal jar auto-detects client
// support: environment "*" + client entrypoint + client mixins (when the target supports it).
tasks.register('patchClientModJson') {
    dependsOn processResources
    def target = file("$buildDir/resources/main/fabric.mod.json")
    inputs.file(target)
    outputs.file(target)
    onlyIf { clientCompanionSupported() }
    doLast {
        def json = target.text
        json = json
            .replace('"environment": "server",', '"environment": "*",')
            .replace(
                '"server": [\n      "net.ded3ec.AuthCoreServer"\n    ]\n  },',
                '"server": [\n      "net.ded3ec.AuthCoreServer"\n    ],\n    "client": [\n      "net.ded3ec.client.ClientAuthCore"\n    ]\n  },')
            .replace(
                '"authcore.server.mixins.json"\n  ],',
                '"authcore.server.mixins.json",\n    "authcore.client.mixins.json"\n  ],')
        target.text = json
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = Integer.parseInt(project.java_release)
}

// ------------------------------------------------------------------
// Client login-screen companion (auto-detected per target).
// The final jar is UNIVERSAL: on 1.19.4+ builds the client classes + client entrypoint
// + client mixins are bundled (fabric.mod.json environment "*"); on older targets the
// client companion cannot compile (screen APIs) and the jar stays server-only.
// The same jar works on a server, on a client, and behind Velocity/BungeeCord.
// ------------------------------------------------------------------

sourceSets {
    client {
        java {
            srcDir 'src/client/java'
        }
        compileClasspath += sourceSets.main.compileClasspath
        compileClasspath += sourceSets.main.output
    }
}

// Version gate: the client screen APIs (DrawContext etc.) exist on 1.19.4+
def clientCompanionSupported() {
    def v = project.minecraft_version
    if (v == null) return false
    if (v.startsWith("26")) return true
    def m = (v =~ /^1\.(\d+)\.(\d+).*$/)
    if (!m) return false
    int minor = Integer.parseInt(m.group(1))
    int patch = Integer.parseInt(m.group(2))
    return minor > 19 || (minor == 19 && patch >= 4)
}

tasks.register('compileAuthClientJava', JavaCompile) {
    dependsOn patchClientModJson
    source = sourceSets.client.java
    classpath = sourceSets.client.compileClasspath
    destinationDirectory = file("build/classes/java/client")
    options.release = Integer.parseInt(project.java_release)
    options.encoding = 'UTF-8'
    onlyIf { clientCompanionSupported() }
    dependsOn compileJava
}

// The universal jar: main code + (when supported) client classes. The fabric.mod.json is
// already client-included by processResources (auto-detected per target version).
tasks.named('jar') {
    dependsOn patchClientModJson
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from(file("build/classes/java/client")) {
        onlyIf { clientCompanionSupported() }
    }
    dependsOn compileAuthClientJava
}

// Legacy client-classifier jar kept for compatibility (same universal content)
tasks.register('clientJar', Jar) {
    dependsOn patchClientModJson
    archiveClassifier = 'client'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    from sourceSets.main.output
    from(file("build/classes/java/client")) {
        onlyIf { clientCompanionSupported() }
    }
    from processResources.outputs
    dependsOn compileAuthClientJava
}

assemble.dependsOn clientJar

tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}


java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    // Version-agnostic: the toolchain below will try to use the configured JDK release.
    // To build for older Minecraft versions, see VERSIONS.md and adjust gradle.properties.
    sourceCompatibility = JavaVersion.toVersion(project.java_release)
    targetCompatibility = JavaVersion.toVersion(project.java_release)
}

// Multi-version support:
// - Change `minecraft_version`, `yarn_mappings`, `loader_version`, `fabric_api_version`,
//   `java_release` and `mixin_compatibility_level` in gradle.properties, then run `gradlew build`.
// - The mod is designed to compile against 1.16.0 through 1.21.x (and newer 1.x versions).
//   Version-specific APIs are isolated behind the compatibility layer in
//   net.ded3ec.utils.McApiManager.PermissionUtil (permission checks) and the mixins are
//   configured to use the Java level required by the target Minecraft version.
compileJava {
    options.release = Integer.parseInt(project.java_release)
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}