plugins {
    id 'fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

// ------------------------------------------------------------------
// Build modes (ONE build script for the whole 1.16.x - 26.x range):
//
//   classic (default):  yarn-named source in src/main/java (+ src/client/java).
//                       Universal jar, compiled at Java 16 level, remapped to stable
//                       intermediary names -> runs on EVERY obfuscated version 1.16 - 1.21.11
//                       (servers AND clients), see -Puniversal=false for per-version builds.
//
//   modern (-Pmodern=true): Mojang-named source in src/modern/java (Minecraft 26.1+ is
//                       unobfuscated - no intermediary, no mappings). Java 25. Produces the
//                       separate 26.x jar.
// ------------------------------------------------------------------
ext.modern = (project.findProperty('modern') ?: 'false').toString() == 'true'
ext.universalBuild = !modern && (project.findProperty('universal') ?: 'true').toString() == 'true'

base {
    // yarn  = classic build (1.16 - 1.21.11, yarn mappings)   -> authcore-yarn-<v>.jar
    // mojang = 26.x build (26.1+, Mojang/unobfuscated names)   -> authcore-mojang-<v>.jar
    archivesName = project.ext.modern ? 'authcore-mojang' : 'authcore-yarn'
}

ext.mcVersion = modern ? '26.2' : project.minecraft_version
ext.loaderVersion = modern ? '0.19.3' : project.loader_version
ext.apiVersion = modern ? '0.156.0+26.2' : project.fabric_api_version

// Java release + mixin compatibility level, derived from the target Minecraft version.
ext.javaRelease = 16
ext.mixinCompatibilityLevel = 'JAVA_16'

if (modern) {
    javaRelease = 25
    mixinCompatibilityLevel = 'JAVA_25'
} else if (!universalBuild) {
    def v = mcVersion
    if (v != null && !v.startsWith("26")) {
        def m = (v =~ /^1\.(\d+)\.(\d+).*$/)
        if (m) {
            int minor = Integer.parseInt(m.group(1))
            int patch = Integer.parseInt(m.group(2))
            if (minor >= 21 || (minor == 20 && patch >= 5)) {
                javaRelease = 21
                mixinCompatibilityLevel = 'JAVA_21'
            } else if (minor >= 17) {
                javaRelease = 17
                mixinCompatibilityLevel = 'JAVA_17'
            }
        }
    }
}

// For the unobfuscated 26.x target loom must not try to remap/deobfuscate anything.
// NOTE: pass `-Pfabric.loom.disableObfuscation=true` together with -Pmodern=true (loom reads
// this project property during minecraft setup - see docs/26x.md for the exact command).

repositories {
    mavenCentral()
    maven {
        url = uri("https://repo.opencollab.dev/main/")
    }
}

// ------------------------------------------------------------------
// Source layout: version variants live under src/ next to each other.
//   src/main/java     classic yarn server code (1.16 - 1.21.11)
//   src/client/java   classic yarn client companion
//   src/modern/java   Mojang-named code for 26.1+ (server + client)
//   src/main/resources     classic fabric.mod.json + mixin configs + assets
//   src/modern/resources   26.x fabric.mod.json (mixins/assets are shared)
// ------------------------------------------------------------------
sourceSets {
    main {
        if (modern) {
            java {
                srcDirs = ['src/modern/java']
            }
            resources {
                srcDir 'src/modern/resources'
                srcDir 'src/main/resources'
            }
        }
    }
    if (!modern) {
        client {
            java {
                srcDir 'src/client/java'
            }
            compileClasspath += sourceSets.main.compileClasspath
            compileClasspath += sourceSets.main.output
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${mcVersion}"

    if (!modern) {
        // Yarn mappings; the built jar is remapped to stable intermediary names so ONE jar
        // runs on every obfuscated version (1.16 - 1.21.11).
        mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    }

    if (modern) {
        // Unobfuscated 26.x: loom's mod* configurations do not exist (no remapping).
        implementation "net.fabricmc:fabric-loader:${loaderVersion}"
        implementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"
    } else {
        modImplementation "net.fabricmc:fabric-loader:${loaderVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-api:${apiVersion}"
        modImplementation "net.fabricmc.fabric-api:fabric-entity-events-v1:${apiVersion}"
    }

    // MySQL Driver
    implementation(include("com.mysql:mysql-connector-j:${mysql_version}"))
    // SQLite Driver
    implementation(include("org.xerial:sqlite-jdbc:${sqlite_version}"))
    // PostgreSQL Driver (optional - enable in config)
    implementation(include("org.postgresql:postgresql:${postgres_version}"))
    // Redis client for network-wide session/ban sync (optional - enable in config)
    implementation(include("redis.clients:jedis:${jedis_version}"))
    implementation(include("org.apache.commons:commons-pool2:${commons_pool2_version}"))
    // BouncyCastle: self-signed certificate generation for the HTTPS web panel
    implementation(include("org.bouncycastle:bcpkix-jdk18on:${bouncycastle_version}"))
    implementation(include("org.bouncycastle:bcprov-jdk18on:${bouncycastle_version}"))
    // Gson for JSON (JDK HttpClient is used for HTTP - no external HTTP library needed)
    implementation(include("com.google.code.gson:gson:${project.gson_version}"))
    // Configurate core + dependencies (HOCON config files)
    implementation(include("net.kyori:option:1.1.0"))
    implementation(include("io.leangen.geantyref:geantyref:1.3.13"))
    implementation(include("org.jetbrains.kotlin:kotlin-stdlib:${project.kotlin_version}"))
    implementation(include("org.spongepowered:configurate-core:${project.configurate_core_version}"))
    implementation(include("org.spongepowered:configurate-hocon:${project.configurate_hocon_version}"))
    // Password4j for password hashing (argon2/bcrypt/scrypt/pbkdf2)
    implementation(include("com.password4j:password4j:${project.password4j_version}"))
    // Floodgate API by GeyserMC (compileOnly, not shaded)
    compileOnly("org.geysermc.floodgate:api:${project.floodgate_version}")
    // LuckPerms API (compileOnly, not shaded)
    compileOnly("net.luckperms:api:5.4")
    // 2FA Library (TOTP - RFC 6238)
    implementation(include("com.j256.two-factor-auth:two-factor-auth:1.3"))
}

processResources {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "version", project.version
    inputs.property "mixin_compatibility_level", mixinCompatibilityLevel

    // For the 26.x build, loom prepends src/main/resources to the resource dirs during its
    // setup; re-order afterwards so the 26.x fabric.mod.json wins the duplicate resolution.
    if (modern) {
        afterEvaluate {
            sourceSets.main.resources.srcDirs = ['src/modern/resources', 'src/main/resources']
        }
    }

    filesMatching("fabric.mod.json") {
        expand "version": inputs.properties.version
    }

    filesMatching("authcore.server.mixins.json") {
        expand "mixin_compatibility_level": inputs.properties.mixin_compatibility_level
    }

    filesMatching("authcore.client.mixins.json") {
        expand "mixin_compatibility_level": inputs.properties.mixin_compatibility_level
    }
}

// The client login-screen companion is bundled in the jar. Its classes only compile against
// targets with the screen APIs (1.20.2+ on the classic line); the modern tree (26.1+) carries
// its own client code in src/modern/java, so nothing extra is needed there.
def clientCompanionSupported() {
    if (modern) return false
    def v = mcVersion
    if (v == null) return false
    if (v.startsWith("26")) return true
    def m = (v =~ /^1\.(\d+)\.(\d+).*$/)
    if (!m) return false
    int minor = Integer.parseInt(m.group(1))
    int patch = Integer.parseInt(m.group(2))
    return minor > 20 || (minor == 20 && patch >= 2)
}

if (!modern) {
    tasks.register('compileAuthClientJava', JavaCompile) {
        source = sourceSets.client.java
        classpath = sourceSets.client.compileClasspath
        destinationDirectory = file("build/classes/java/client")
        options.release = javaRelease
        options.encoding = 'UTF-8'
        onlyIf { clientCompanionSupported() }
        dependsOn compileJava
    }

    tasks.named('jar') {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
        if (clientCompanionSupported()) {
            from(file("build/classes/java/client"))
        }
        dependsOn compileAuthClientJava
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaRelease
}

tasks.withType(JavaExec).configureEach {
    jvmArgs '--enable-native-access=ALL-UNNAMED'
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.toVersion(javaRelease)
    targetCompatibility = JavaVersion.toVersion(javaRelease)
}

tasks.withType(AbstractArchiveTask).configureEach {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

jar {
    inputs.property "archivesName", project.base.archivesName

    from("LICENSE") {
        rename { "${it}_${inputs.properties.archivesName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            artifactId = project.archives_base_name
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}
